<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presentation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .slide { position: relative; overflow: hidden; }
  .slide .el { position: absolute; }
  .slide .tx { display: flex; flex-direction: column; overflow: visible; }
  .slide .tx p { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
  .slide .tx p.bul { position: relative; }
  .slide .tx p.bul::before { content: "•"; position: absolute; left: 0; color: var(--bul, currentColor); }
  .slide .tx p.bul.l1::before { content: "–"; }
  .slide table { border-collapse: collapse; width: 100%; height: 100%; table-layout: fixed; }
  .slide td, .slide th { padding: 0 12px; text-align: left; overflow: hidden; }
  .slide svg { width: 100%; height: 100%; stroke: none; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .frame { position: relative; overflow: hidden; box-shadow: 0 0 80px rgba(0,0,0,.6); }
  .frame > .host { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* transitions */
  .frame.in-fade { animation: fadeIn .55s ease both; }
  .frame.in-push { animation: pushIn .55s cubic-bezier(.2,.8,.2,1) both; }
  .frame.in-push-back { animation: pushBack .55s cubic-bezier(.2,.8,.2,1) both; }
  .frame.in-zoom { animation: zoomIn .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes pushIn { from { transform: translateX(14%); opacity: 0; } }
  @keyframes pushBack { from { transform: translateX(-14%); opacity: 0; } }
  @keyframes zoomIn { from { transform: scale(.82); opacity: 0; } }
  /* builds */
  .build { opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1); }
  .build.on { opacity: 1; transform: none; }
  /* prezi world */
  #world { position: fixed; left: 0; top: 0; transform-origin: 0 0; transition: transform 1.1s cubic-bezier(.65,0,.35,1); }
  #world .cell { position: absolute; box-shadow: 0 0 60px rgba(0,0,0,.5); }
  /* quiz */
  .quiz-opt { cursor: pointer; transition: box-shadow .2s, background .2s; }
  .quiz-opt:hover { box-shadow: 0 0 0 3px rgba(255,255,255,.35) inset; }
  .quiz-opt.right { background: #16a34a !important; box-shadow: 0 0 0 4px #4ade80 inset; }
  .quiz-opt.wrong { background: #b91c1c !important; box-shadow: 0 0 0 4px #f87171 inset; }
  .presenting .quiz-explain { opacity: 0; transition: opacity .4s; }
  .presenting .quiz-explain.show { opacity: 1; }
  /* chrome */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 14px; align-items: center; padding: 10px 16px; font-size: 13px; color: #bbb;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); opacity: 0; transition: opacity .3s; z-index: 20; }
  body:hover #bar, #bar:focus-within { opacity: 1; }
  @media (hover: none), (max-width: 760px) {
    #bar { opacity: 1; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); gap: 6px; font-size: 12px; overflow-x: auto; background: rgba(0,0,0,.6); }
    #bar button, #bar select { padding: 6px 9px; font-size: 12px; flex: none; }
    #bLaser, #bPresenter { display: none; }
    #notes { bottom: calc(52px + env(safe-area-inset-bottom)); font-size: 14px; }
    #grid { padding: 14px; } #grid .items { grid-template-columns: 1fr 1fr; gap: 10px; }
  }
  #bar button, #bar select { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #bar .spacer { flex: 1; }
  #progress { position: fixed; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg,#7c9cff,#c08cff); transition: width .4s; z-index: 21; }
  #notes { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); width: min(820px, 92vw); max-height: 40vh; overflow: auto;
    background: rgba(18,19,25,.95); border: 1px solid #333; border-radius: 12px; padding: 14px 18px; font-size: 16px; z-index: 25; }
  #laser { position: fixed; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #ff2d2d; box-shadow: 0 0 18px 6px rgba(255,45,45,.55);
    pointer-events: none; z-index: 30; display: none; }
  #grid { position: fixed; inset: 0; overflow: auto; background: #0b0c10; z-index: 40; padding: 28px; display: none; }
  #grid .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  #grid .it { cursor: pointer; color: #aaa; font-size: 12px; }
  #grid .it .th { position: relative; overflow: hidden; border-radius: 6px; outline: 2px solid transparent; }
  #grid .it.cur .th { outline-color: #7c9cff; }
  #rotate { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(20,21,27,.92); border: 1px solid #333; color: #ddd;
    padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 30; transition: opacity .6s; white-space: nowrap; }
  #black { position: fixed; inset: 0; background: #000; z-index: 35; display: none; }
  /* presenter view */
  body.presenter { overflow: auto; background: #111318; }
  #pv { display: none; height: 100%; padding: 16px; gap: 16px; grid-template-columns: 1.6fr 1fr; grid-template-rows: auto 1fr; }
  body.presenter #pv { display: grid; }
  #pv .now, #pv .next { position: relative; overflow: hidden; border-radius: 8px; background: #000; }
  #pv h4 { margin: 0 0 8px; color: #8b93a7; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  #pv .notes { grid-column: 1 / 3; background: #181b22; border-radius: 10px; padding: 16px 20px; font-size: 20px; line-height: 1.5; overflow: auto; white-space: pre-wrap; }
  #pv .meta { display: flex; gap: 14px; align-items: center; margin-top: 10px; font-size: 22px; font-variant-numeric: tabular-nums; }
  #pv button { background: #262a35; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  /* print */
  @media print { @page { margin: 0; } html, body { background: #fff; overflow: visible; height: auto; } #bar, #progress, #notes, #stage { display: none !important; }
    .page { break-after: page; position: relative; overflow: hidden; } }
  body.print { overflow: auto; background: #555; }
  body.print .page { margin: 0 auto 12px; background: #fff; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="world" hidden></div>
<div id="progress"></div>
<div id="bar">
  <span id="count"></span>
  <span class="spacer"></span>
  <select id="trans" title="Transition"><option value="none">No transition</option><option value="fade">Fade</option><option value="push">Push</option><option value="zoom">Zoom</option><option value="prezi">Prezi zoom</option></select>
  <button id="bNotes" title="N">Notes</button><button id="bGrid" title="O">Overview</button><button id="bLaser" title="L">Laser</button>
  <button id="bPresenter" title="P">Presenter view</button><button id="bFull" title="F">Fullscreen</button>
</div>
<div id="notes" hidden></div>
<div id="laser"></div>
<div id="grid"><div class="items"></div></div>
<div id="black"></div>
<div id="rotate" hidden>Rotate your phone for a bigger view ↻</div>
<div id="pv">
  <div><h4>Current</h4><div class="now"></div><div class="meta"><span id="pvCount"></span><span id="pvTimer">00:00</span>
    <button id="pvPrev">◀ Prev</button><button id="pvNext">Next ▶</button><button id="pvReset">Reset timer</button></div></div>
  <div><h4>Next</h4><div class="next"></div></div>
  <div class="notes" id="pvNotes"></div>
</div>
<script>
/*__SLIDES_JS__*/
</script>
<script>
const DECK = "__DECK_DATA__";
const params = new URLSearchParams(location.search);
const slides = DECK.slides, theme = DECK.theme;
let i = Math.max(0, Math.min(slides.length - 1, parseInt(params.get("start") || "0", 10) || 0));
let transition = params.get("transition") || (DECK.settings && DECK.settings.transition) || "fade";
const builds = !(DECK.settings && DECK.settings.builds === false);
const chan = "BroadcastChannel" in window ? new BroadcastChannel("slidesmith-" + (DECK.id || DECK.name)) : null;
const $ = (s) => document.querySelector(s);
document.title = DECK.name || "Presentation";
$("#trans").value = transition;

function fit(w, h, W = innerWidth, H = innerHeight) { return Math.min(W / w, H / h); }
function slideNode(n, width) {
  const s = slides[n], L = s.layout;
  const frame = document.createElement("div");
  frame.className = "frame";
  const scale = width / (L.w * PX);
  frame.style.width = width + "px";
  frame.style.height = L.h * PX * scale + "px";
  const host = document.createElement("div");
  host.className = "host";
  host.style.transform = `scale(${scale})`;
  host.appendChild(renderSlide(L, theme));
  frame.appendChild(host);
  return frame;
}

/* ---------------- standard stage ---------------- */
function show(n, dir = 1) {
  i = Math.max(0, Math.min(slides.length - 1, n));
  if (transition === "prezi") return preziGo(i);
  const L = slides[i].layout;
  const w = L.w * PX * fit(L.w * PX, L.h * PX);
  const frame = slideNode(i, w);
  if (transition !== "none") frame.classList.add(transition === "push" ? (dir < 0 ? "in-push-back" : "in-push") : "in-" + transition);
  $("#stage").replaceChildren(frame);
  if (builds) animateBuilds(frame);
  wireQuiz(frame);
  after();
}
function animateBuilds(frame) {
  const els = [...frame.querySelectorAll(".slide > .el")].filter((e) => !e.dataset.static);
  els.sort((a, b) => parseFloat(a.style.top) - parseFloat(b.style.top) || parseFloat(a.style.left) - parseFloat(b.style.left));
  els.forEach((e, k) => { e.classList.add("build"); setTimeout(() => e.classList.add("on"), 120 + Math.min(k, 14) * 70); });
}
function wireQuiz(root) {
  root.classList.add("presenting");
  root.querySelectorAll(".quiz-opt").forEach((opt) => {
    opt.addEventListener("click", (e) => {
      e.stopPropagation();
      const scope = opt.closest(".slide");
      scope.querySelectorAll(".quiz-opt").forEach((o) => o.dataset.correct === "1" && o.classList.add("right"));
      if (opt.dataset.correct !== "1") opt.classList.add("wrong");
      scope.querySelectorAll(".quiz-explain").forEach((x) => x.classList.add("show"));
    });
  });
}
function after() {
  $("#count").textContent = `${i + 1} / ${slides.length}`;
  $("#progress").style.width = ((i + 1) / slides.length) * 100 + "%";
  $("#notes").textContent = slides[i].spec.notes || "No speaker notes for this slide.";
  if (chan && !document.body.classList.contains("presenter")) chan.postMessage({ type: "at", i });
  document.querySelectorAll("#grid .it").forEach((it, k) => it.classList.toggle("cur", k === i));
}

/* ---------------- Prezi-style zoom path ---------------- */
let worldBuilt = false;
const COLS = 4, GAP = 160;
function cellPos(n) { const L = slides[0].layout; const w = L.w * PX, h = L.h * PX;
  return { x: (n % COLS) * (w + GAP) + ((Math.floor(n / COLS) % 2) ? (w + GAP) / 2 : 0), y: Math.floor(n / COLS) * (h + GAP), w, h }; }
function buildWorld() {
  const world = $("#world");
  world.innerHTML = "";
  slides.forEach((s, n) => {
    const p = cellPos(n);
    const cell = document.createElement("div");
    cell.className = "cell";
    Object.assign(cell.style, { left: p.x + "px", top: p.y + "px", width: p.w + "px", height: p.h + "px" });
    cell.appendChild(renderSlide(s.layout, theme));
    world.appendChild(cell);
    wireQuiz(cell);
  });
  worldBuilt = true;
}
function camera(box, animate = true) {
  const world = $("#world");
  const s = fit(box.w, box.h) * (box.pad || 1);
  const tx = innerWidth / 2 - (box.x + box.w / 2) * s, ty = innerHeight / 2 - (box.y + box.h / 2) * s;
  world.style.transition = animate ? "" : "none";
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
}
let preziAt = null;
function preziGo(n) {
  if (!worldBuilt) buildWorld();
  $("#stage").replaceChildren();
  $("#world").hidden = false;
  const to = cellPos(n);
  if (preziAt === null) { camera(to, false); preziAt = n; after(); return; }
  const from = cellPos(preziAt);
  const x0 = Math.min(from.x, to.x), y0 = Math.min(from.y, to.y);
  const x1 = Math.max(from.x + from.w, to.x + to.w), y1 = Math.max(from.y + from.h, to.y + to.h);
  camera({ x: x0, y: y0, w: x1 - x0, h: y1 - y0, pad: 0.82 });
  clearTimeout(preziGo.t);
  preziGo.t = setTimeout(() => camera(to), 900);
  preziAt = n;
  after();
}

/* ---------------- overview, notes, laser, presenter ---------------- */
function buildGrid() {
  const items = $("#grid .items");
  items.innerHTML = "";
  slides.forEach((s, n) => {
    const it = document.createElement("div");
    it.className = "it";
    const th = document.createElement("div");
    th.className = "th";
    th.appendChild(slideNode(n, Math.min(260, Math.floor((innerWidth - 40) / 2))));
    it.appendChild(th);
    it.appendChild(Object.assign(document.createElement("div"), { textContent: `${n + 1}. ${s.spec.title || ""}` }));
    it.onclick = () => { toggleGrid(false); show(n); };
    items.appendChild(it);
  });
}
function toggleGrid(on) { const g = $("#grid"); on = on ?? g.style.display !== "block"; if (on && !g.dataset.built) { buildGrid(); g.dataset.built = 1; } g.style.display = on ? "block" : "none"; after(); }
let laser = false;
function toggleLaser() { laser = !laser; $("#laser").style.display = laser ? "block" : "none"; document.body.style.cursor = laser ? "none" : ""; }
addEventListener("mousemove", (e) => { if (laser) Object.assign($("#laser").style, { left: e.clientX + "px", top: e.clientY + "px" }); });
function openPresenter() { const u = new URL(location.href); u.searchParams.set("presenter", "1"); u.searchParams.set("start", i); window.open(u.toString(), "slidesmith-presenter", "width=1200,height=760"); }
function next() { if (i < slides.length - 1) show(i + 1, 1); }
function prev() { if (i > 0) show(i - 1, -1); }

/* presenter window: notes, current + next, timer; drives the audience window */
let t0 = Date.now();
function presenterRender() {
  const L = slides[i].layout;
  const now = $("#pv .now"), nx = $("#pv .next");
  const w1 = now.parentElement.clientWidth, w2 = nx.parentElement.clientWidth;
  now.replaceChildren(slideNode(i, w1));
  nx.replaceChildren(i + 1 < slides.length ? slideNode(i + 1, w2) : Object.assign(document.createElement("div"), { textContent: "End of presentation", style: "padding:20px;color:#888" }));
  $("#pvNotes").textContent = slides[i].spec.notes || "No speaker notes for this slide.";
  $("#pvCount").textContent = `${i + 1} / ${slides.length}`;
}
function presenterGo(n) { i = Math.max(0, Math.min(slides.length - 1, n)); presenterRender(); chan && chan.postMessage({ type: "go", i }); }

/* ---------------- print (PDF) ---------------- */
function printAll() {
  document.body.className = "print";
  $("#stage").remove();
  const L = slides[0].layout;
  const style = document.createElement("style");
  style.textContent = `@page { size: ${L.w}in ${L.h}in; margin: 0; }`;
  document.head.appendChild(style);
  slides.forEach((s, n) => {
    const page = document.createElement("div");
    page.className = "page";
    page.style.width = s.layout.w + "in";
    page.style.height = s.layout.h + "in";
    page.appendChild(slideNode(n, s.layout.w * 96));
    document.body.appendChild(page);
  });
  const imgs = [...document.images];
  Promise.all(imgs.map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))).then(() => setTimeout(() => window.print(), 400));
}

/* ---------------- wiring ---------------- */
if (matchMedia("(orientation: portrait) and (max-width: 760px)").matches && !params.get("print") && !params.get("presenter")) {
  const hint = $("#rotate");
  hint.hidden = false;
  setTimeout(() => (hint.style.opacity = "0"), 3500);
  setTimeout(() => (hint.hidden = true), 4200);
}
if (params.get("print")) printAll();
else if (params.get("presenter")) {
  document.body.classList.add("presenter");
  $("#stage").remove(); $("#bar").remove(); $("#progress").remove();
  $("#pvPrev").onclick = () => presenterGo(i - 1);
  $("#pvNext").onclick = () => presenterGo(i + 1);
  $("#pvReset").onclick = () => (t0 = Date.now());
  setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $("#pvTimer").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 500);
  addEventListener("keydown", (e) => { if (["ArrowRight", "PageDown", " "].includes(e.key)) presenterGo(i + 1); if (["ArrowLeft", "PageUp"].includes(e.key)) presenterGo(i - 1); });
  chan && (chan.onmessage = (m) => { if (m.data.type === "at" && m.data.i !== i) { i = m.data.i; presenterRender(); } });
  addEventListener("resize", presenterRender);
  presenterRender();
} else {
  show(i);
  chan && (chan.onmessage = (m) => { if (m.data.type === "go") show(m.data.i, m.data.i >= i ? 1 : -1); });
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    const k = e.key.toLowerCase();
    if (["arrowright", "pagedown", " ", "enter"].includes(k)) { e.preventDefault(); next(); }
    else if (["arrowleft", "pageup", "backspace"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "home") show(0); else if (k === "end") show(slides.length - 1);
    else if (k === "n") $("#notes").hidden = !$("#notes").hidden;
    else if (k === "o" || (k === "escape" && $("#grid").style.display === "block")) toggleGrid();
    else if (k === "l") toggleLaser();
    else if (k === "b") $("#black").style.display = $("#black").style.display === "block" ? "none" : "block";
    else if (k === "p") openPresenter();
    else if (k === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
  const tap = (e) => { if (e.target.closest(".quiz-opt")) return; e.clientX < innerWidth * 0.3 ? prev() : next(); };
  $("#stage").addEventListener("click", tap);
  $("#world").addEventListener("click", tap);
  let tx = null;
  addEventListener("touchstart", (e) => (tx = e.touches[0].clientX));
  addEventListener("touchend", (e) => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) dx < 0 ? next() : prev(); tx = null; });
  $("#trans").onchange = (e) => { transition = e.target.value; $("#world").hidden = transition !== "prezi"; preziAt = null; show(i); };
  $("#bNotes").onclick = () => ($("#notes").hidden = !$("#notes").hidden);
  $("#bGrid").onclick = () => toggleGrid();
  $("#bLaser").onclick = toggleLaser;
  $("#bPresenter").onclick = openPresenter;
  $("#bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  addEventListener("resize", () => (transition === "prezi" ? camera(cellPos(i), false) : show(i)));
}
</script>
</body>
</html>
